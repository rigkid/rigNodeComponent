name: CI

on:
  pull_request:
  push:
    branches: [ main ]

env:
  PACK: rigNodeComponent
  HERO_PACK: rigNodeEditor
  HERO: nodes
  SMOKE: node_smoke

jobs:
  example:
    runs-on: ubuntu-latest
    steps:
      - name: Require private-repo CI token
        env:
          RIGKIT_CI_TOKEN: ${{ secrets.RIGKIT_CI_TOKEN }}
        run: |
          if [ -z "$RIGKIT_CI_TOKEN" ]; then
            echo "::error::Missing secret RIGKIT_CI_TOKEN."
            exit 1
          fi

      - name: Checkout pack
        uses: actions/checkout@v4
        with:
          path: pack

      - name: Checkout RigKit host
        uses: actions/checkout@v4
        with:
          repository: rigkid/rigkit
          path: host
          submodules: recursive
          token: ${{ secrets.RIGKIT_CI_TOKEN }}

      - name: Overlay pack under test
        run: |
          rm -rf "host/packs/${PACK}"
          mkdir -p host/packs
          cp -a pack "host/packs/${PACK}"

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build \
            libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev \
            libgl1-mesa-dev

      - name: Configure editor hero (shared)
        working-directory: host
        run: >
          cmake -S "packs/${HERO_PACK}/examples/${HERO}"
          -B "packs/${HERO_PACK}/examples/${HERO}/build"
          -G Ninja
          -DCMAKE_BUILD_TYPE=Release

      - name: Build editor hero
        working-directory: host
        run: cmake --build "packs/${HERO_PACK}/examples/${HERO}/build"

      - name: Build smoke
        working-directory: host
        run: cmake --build "packs/${HERO_PACK}/examples/${HERO}/build" --target ${SMOKE}
