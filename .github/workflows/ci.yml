name: CI

on:
  pull_request:
  push:
    branches: [ main ]

env:
  PACK: rigNodeComponent
  HERO_PACK: rigNodeEditor
  HERO: nodes
  SMOKE: node_smoke

jobs:
  boundary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Data packs register components, never systems
        run: |
          if grep -rn 'registerSystem' src/ 2>/dev/null; then
            echo "::error::Data pack rigNodeComponent registers a system - systems live in code packs."
            exit 1
          fi
          echo "rigNodeComponent: no systems registered."

  example:
    runs-on: ubuntu-latest
    steps:

      - name: Check private-repo CI token
        env:
          RIGKIT_CI_TOKEN: ${{ secrets.RIGKIT_CI_TOKEN }}
        run: |
          if [ -z "$RIGKIT_CI_TOKEN" ]; then
            echo "::warning::No RIGKIT_CI_TOKEN. Public remotes still clone; jobs that reach a private in-org pack will fail later. Fine-grained PAT with Contents:read on rigkid/RigKit and the in-org packs, set as an org secret (visibility: all repositories) or a repo secret. On GitHub Free, private repos never receive org secrets - they need a repo secret."
          fi

      - name: Checkout pack
        uses: actions/checkout@v4
        with:
          path: pack

      - name: Checkout RigKit host
        uses: actions/checkout@v4
        with:
          repository: rigkid/RigKit
          path: host
          submodules: recursive
          token: ${{ secrets.RIGKIT_CI_TOKEN || github.token }}

      - name: Overlay pack under test
        run: |
          rm -rf "host/packs/${PACK}"
          mkdir -p host/packs
          cp -a pack "host/packs/${PACK}"

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build pkg-config \
            libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev \
            libgl1-mesa-dev \
            libwayland-dev libwayland-bin libxkbcommon-dev

      - name: Configure editor hero (shared)
        working-directory: host
        run: >
          cmake -S "packs/${HERO_PACK}/examples/${HERO}"
          -B "packs/${HERO_PACK}/examples/${HERO}/build"
          -G Ninja
          -DCMAKE_BUILD_TYPE=Release

      - name: Build editor hero
        working-directory: host
        run: cmake --build "packs/${HERO_PACK}/examples/${HERO}/build"

      - name: Build smoke
        working-directory: host
        run: cmake --build "packs/${HERO_PACK}/examples/${HERO}/build" --target ${SMOKE}
